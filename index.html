<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Шахматы — Тренер (Stockfish)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
  :root {
    --board-size: min(90vw, 480px);
    --sq-size: calc(var(--board-size) / 8);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 50% 0%, #2a2a35 0%, #151518 100%);
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
    min-height: 100vh;
    overflow-x: hidden;
  }
  h2 { margin: 10px 0; letter-spacing: 1px; color: #f0d9b5; font-size: 22px; }

  #status {
    font-size: 15px;
    padding: 8px 18px;
    background: rgba(255,255,255,0.06);
    border-radius: 10px;
    margin: 5px 0 10px;
    text-align: center;
    width: 100%;
    max-width: var(--board-size);
  }

  #quality {
    font-size: 14px;
    font-weight: 700;
    padding: 8px 18px;
    border-radius: 8px;
    margin-bottom: 10px;
    display: none;
    text-align: center;
    width: 100%;
    max-width: var(--board-size);
    animation: pop 0.3s ease-out;
  }
  @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .quality-excellent  { background: #1b5e20; color: #a5f5b5; }
  .quality-good       { background: #33691e; color: #dcedc8; }
  .quality-neutral    { background: #37474f; color: #cfd8dc; }
  .quality-inaccuracy { background: #e65100; color: #fff3e0; }
  .quality-mistake    { background: #c62828; color: #ffcdd2; }
  .quality-blunder    { background: #7f0000; color: #ffcdd2; border: 1px solid #f44336; }

  #board-wrap {
    position: relative;
    padding: 12px;
    background: #1a1a1f;
    border-radius: 12px;
    box-shadow: 0 14px 44px rgba(0,0,0,0.65);
  }
  #board {
    display: grid;
    grid-template-columns: repeat(8, var(--sq-size));
    grid-template-rows: repeat(8, var(--sq-size));
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 0 0 2px #0e0e12;
  }
  .sq {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--sq-size) * 0.75);
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .light { background: #f0d9b5; }
  .dark  { background: #b58863; }
  
  .sq.sel       { box-shadow: inset 0 0 0 4px #ffd700; }
  .sq.last-move { background-image: linear-gradient(rgba(255,215,0,0.4), rgba(255,215,0,0.4)); }
  .sq.hint-move { box-shadow: inset 0 0 0 4px #00e676; }
  .sq.in-check  { background-image: linear-gradient(rgba(244,67,54,0.7), rgba(244,67,54,0.7)); }

  .move-dot { position: absolute; width: 30%; height: 30%; border-radius: 50%; background: rgba(0,0,0,0.3); pointer-events: none; }
  .move-capture { position: absolute; inset: 6%; border-radius: 50%; border: 5px solid rgba(0,0,0,0.3); pointer-events: none; }

  .coord-file, .coord-rank {
    position: absolute; font-size: calc(var(--sq-size) * 0.18); font-weight: 700;
    pointer-events: none; opacity: 0.6;
  }
  .light .coord-file, .light .coord-rank { color: #8a6d4b; }
  .dark  .coord-file, .dark  .coord-rank { color: #f5e6cf; }
  .coord-file { bottom: 2px; right: 4px; }
  .coord-rank { top: 2px; left: 4px; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; max-width: var(--board-size); margin-top: 15px; }
  button {
    padding: 10px 14px; font-size: 14px; font-weight: 600; border: none; border-radius: 8px;
    background: #4a4a55; color: #eee; cursor: pointer; flex: 1; min-width: 100px;
    transition: 0.2s;
  }
  button:active { transform: scale(0.95); background: #35353d; }

  #engine-status { font-size: 12px; color: #888; margin-top: 15px; text-align: center; }
</style>
</head>
<body>
<h2>♟ Шахматный Тренер</h2>
<div id="status">Ход белых</div>
<div id="quality"></div>
<div id="board-wrap"><div id="board"></div></div>
<div class="controls">
  <button onclick="resetGame()">🔄 Новая игра</button>
  <button onclick="undoMove()">↶ Ход назад</button>
  <button onclick="flipBoard()">🔃 Перевернуть</button>
  <button onclick="analyzePosition()">💡 Подсказка</button>
</div>
<div id="engine-status">Инициализация...</div>

<script>
if (typeof Chess === 'undefined') {
  document.getElementById('status').textContent = '❌ Ошибка загрузки chess.js. Проверьте интернет.';
  throw new Error('chess.js missing');
}

const PIECES = { wk:'♔', wq:'♕', wr:'♖', wb:'♗', wn:'♘', wp:'♙', bk:'♚', bq:'♛', br:'♜', bb:'♝', bn:'♞', bp:'♟' };
const PIECE_VALUE = { p:100, n:320, b:330, r:500, q:900, k:20000 };

let game = new Chess();
let selectedSquare = null;
let lastMoveSquares = [];
let bestMoveHint = null;
let boardFlipped = false;
let legalTargets = [];

// Переменные для оценки качества хода
let prevScoreWhite = null; // Оценка позиции (в сантипешках) с точки зрения белых
let prevTurn = null;       // Чей был ход перед текущим анализом

let stockfish = null;
let engineReady = false;
let engineFailed = false;
let currentSearchResolve = null;
let searchTimerId = null;
let multiPVLines = {};
let lastPrimaryScore = null;

// ==========================================
// 1. ИНИЦИАЛИЗАЦИЯ ДВИЖКА
// ==========================================
async function initStockfish() {
  const st = document.getElementById('engine-status');
  try {
    const url = 'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.1/stockfish.js';
    const response = await fetch(url);
    if (!response.ok) throw new Error('Fetch failed');
    
    const scriptText = await response.text();
    const blob = new Blob([scriptText], { type: 'application/javascript' });
    const workerUrl = URL.createObjectURL(blob);
    
    stockfish = new Worker(workerUrl);
    
    stockfish.onerror = (e) => {
      console.error('Worker error:', e);
      failEngine('Ошибка внутри движка. Включен резервный режим.');
    };

    stockfish.onmessage = (ev) => handleEngineMessage(ev.data);
    
    stockfish.postMessage('uci');
    stockfish.postMessage('isready');

    setTimeout(() => { if (!engineReady) failEngine('Движок не отвечает. Резервный режим.'); }, 2500);

  } catch (e) {
    console.warn('Stockfish failed to load:', e);
    failEngine('Нет доступа к CDN движка. Резервный режим.');
  }
}

function failEngine(msg) {
  if (engineReady || engineFailed) return;
  engineFailed = true;
  document.getElementById('engine-status').textContent = '⚠ ' + msg;
}

function handleEngineMessage(line) {
  if (typeof line !== 'string') return;

  if (line === 'uciok') {
    stockfish.postMessage('setoption name Skill Level value 20');
    stockfish.postMessage('setoption name MultiPV value 3');
    stockfish.postMessage('isready');
    return;
  }
  if (line === 'readyok') {
    if (!engineReady) {
      engineReady = true;
      document.getElementById('engine-status').textContent = '✅ Stockfish готов (Макс. сила)';
      analyzePosition(); // Анализируем стартовую позицию
    }
    return;
  }
  if (line.startsWith('info') && line.includes('multipv')) {
    const mp = line.match(/multipv\s+(\d+)/);
    const sc = line.match(/score\s+(cp|mate)\s+(-?\d+)/);
    const pv = line.match(/pv\s+([a-h][1-8][a-h][1-8][qrbn]?)/);
    if (mp && pv) {
      let score = 0;
      if (sc) {
        score = parseInt(sc[2], 10);
        if (sc[1] === 'mate') score = score > 0 ? 100000 : -100000;
      }
      multiPVLines[parseInt(mp[1], 10)] = { move: pv[1], score };
    }
    return;
  }
  if (line.startsWith('bestmove')) {
    if (searchTimerId) { clearTimeout(searchTimerId); searchTimerId = null; }
    const bestMove = line.split(/\s+/)[1];
    const candidates = Object.values(multiPVLines).sort((a, b) => b.score - a.score).map(x => x.move);
    
    if (candidates.length === 0 && bestMove && bestMove !== '(none)') candidates.push(bestMove);
    lastPrimaryScore = multiPVLines[1] ? multiPVLines[1].score : null;

    if (currentSearchResolve) {
      currentSearchResolve({ moves: candidates, score: lastPrimaryScore });
      currentSearchResolve = null;
    }
    multiPVLines = {};
  }
}

function getEngineMoves(fen, movetime = 150) {
  return new Promise((resolve) => {
    if (!engineReady || engineFailed || !stockfish) {
      return resolve(getFallbackMove(game));
    }
    if (currentSearchResolve) { stockfish.postMessage('stop'); currentSearchResolve = null; }

    multiPVLines = {};
    lastPrimaryScore = null;
    currentSearchResolve = (result) => {
      if (searchTimerId) clearTimeout(searchTimerId);
      resolve(result);
    };

    stockfish.postMessage('position fen ' + fen);
    stockfish.postMessage('go movetime ' + movetime);
    searchTimerId = setTimeout(() => stockfish.postMessage('stop'), movetime + 1000);
  });
}

// ==========================================
// 2. РЕЗЕРВНЫЙ АЛГОРИТМ (Если движок не загрузился)
// ==========================================
const PAWN_PST = [
   0,  0,  0,  0,  0,  0,  0,  0,
  50, 50, 50, 50, 50, 50, 50, 50,
  10, 10, 20, 30, 30, 20, 10, 10,
   5,  5, 10, 25, 25, 10,  5,  5,
   0,  0,  0, 20, 20,  0,  0,  0,
   5, -5,-10,  0,  0,-10, -5,  5,
   5, 10, 10,-20,-20, 10, 10,  5,
   0,  0,  0,  0,  0,  0,  0,  0
];

function evaluatePosition(g) {
  if (g.in_checkmate()) return g.turn() === 'w' ? -99999 : 99999;
  if (g.in_draw()) return 0;

  let score = 0;
  const grid = g.board();
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = grid[r][c];
      if (!p) continue;
      let val = PIECE_VALUE[p.type];
      if (p.type === 'p') {
        const index = p.color === 'w' ? (r * 8 + c) : ((7 - r) * 8 + c);
        val += PAWN_PST[index];
      }
      score += p.color === 'w' ? val : -val;
    }
  }
  return g.turn() === 'w' ? score : -score;
}

function minimax(g, depth, alpha, beta, isMax) {
  if (depth === 0 || g.game_over()) return evaluatePosition(g);
  const moves = g.moves({ verbose: true });
  if (isMax) {
    let best = -Infinity;
    for (const m of moves) {
      g.move(m);
      best = Math.max(best, minimax(g, depth - 1, alpha, beta, false));
      g.undo();
      alpha = Math.max(alpha, best);
      if (beta <= alpha) break;
    }
    return best;
  } else {
    let best = Infinity;
    for (const m of moves) {
      g.move(m);
      best = Math.min(best, minimax(g, depth - 1, alpha, beta, true));
      g.undo();
      beta = Math.min(beta, best);
      if (beta <= alpha) break;
    }
    return best;
  }
}

function getFallbackMove(g) {
  const moves = g.moves({ verbose: true });
  if (!moves.length) return { moves: [], score: 0 };
  
  let bestMove = null;
  let bestScore = -Infinity;
  const turn = g.turn();
  
  for (const m of moves) {
    g.move(m);
    // Оценка с точки зрения ходившего (после хода ход перешел к противнику, поэтому инвертируем)
    const score = -evaluatePosition(g);
    g.undo();
    
    if (score > bestScore) {
      bestScore = score;
      bestMove = m;
    }
  }
  
  // Приводим оценку к точке зрения белых
  const scoreWhite = turn === 'w' ? bestScore : -bestScore;
  return { moves: [bestMove.from + bestMove.to + (bestMove.promotion || '')], score: scoreWhite };
}

// ==========================================
// 3. АНАЛИЗ И ОЦЕНКА КАЧЕСТВА ХОДА
// ==========================================
async function analyzePosition() {
  if (game.game_over()) {
    bestMoveHint = null;
    renderBoard();
    return;
  }

  const currentTurn = game.turn();
  const fen = game.fen();
  
  // Запрашиваем у движка лучший ход и оценку текущей позиции
  const res = await getEngineMoves(fen, 150);
  
  // Устанавливаем подсказку (зеленая рамка)
  if (res.moves.length > 0) {
    bestMoveHint = { from: res.moves[0].slice(0,2), to: res.moves[0].slice(2,4) };
  } else {
    bestMoveHint = null;
  }

  // Оценка качества ПРЕДЫДУЩЕГО хода
  if (prevScoreWhite !== null && prevTurn !== null && res.score !== null) {
    const currentScoreWhite = res.score;
    let loss;
    
    // Если ходили белые: потеря = оценка до - оценка после
    // Если ходили черные: оценка до для них была -prevScoreWhite, после -currentScoreWhite
    // Потеря = (-prevScoreWhite) - (-currentScoreWhite) = currentScoreWhite - prevScoreWhite
    if (prevTurn === 'w') {
      loss = prevScoreWhite - currentScoreWhite;
    } else {
      loss = currentScoreWhite - prevScoreWhite;
    }
    
    showQuality(loss);
  } else {
    document.getElementById('quality').style.display = 'none';
  }
  
  // Запоминаем оценку для следующего хода
  prevScoreWhite = res.score;
  prevTurn = currentTurn;
  
  renderBoard();
}

function showQuality(loss) {
  const el = document.getElementById('quality');
  if (loss <= -30) { el.textContent = '🌟 Отличный ход!'; el.className = 'quality-excellent'; }
  else if (loss <= 20) { el.textContent = '👍 Хороший ход'; el.className = 'quality-good'; }
  else if (loss <= 60) { el.textContent = '😐 Нормально'; el.className = 'quality-neutral'; }
  else if (loss <= 150) { el.textContent = '⚠️ Неточность'; el.className = 'quality-inaccuracy'; }
  else if (loss <= 300) { el.textContent = '❌ Ошибка'; el.className = 'quality-mistake'; }
  else { el.textContent = '💩 Полная хуйня'; el.className = 'quality-blunder'; }
  el.style.display = 'block';
}

// ==========================================
// 4. ОТРИСОВКА И ИГРА
// ==========================================
function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  const grid = game.board();
  
  let checkSq = null;
  if (game.in_check()) {
    for (let r=0; r<8; r++) for(let c=0; c<8; c++) {
      const p = grid[r][c];
      if (p && p.type === 'k' && p.color === game.turn()) checkSq = 'abcdefgh'[c] + (8-r);
    }
  }

  for (let dr = 0; dr < 8; dr++) {
    for (let dc = 0; dc < 8; dc++) {
      const r = boardFlipped ? 7 - dr : dr;
      const c = boardFlipped ? 7 - dc : dc;
      const file = 'abcdefgh'[c];
      const rank = 8 - r;
      const sqName = file + rank;

      const sq = document.createElement('div');
      sq.className = 'sq ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
      if (selectedSquare === sqName) sq.classList.add('sel');
      if (lastMoveSquares.includes(sqName)) sq.classList.add('last-move');
      if (checkSq === sqName) sq.classList.add('in-check');
      if (bestMoveHint && (bestMoveHint.from === sqName || bestMoveHint.to === sqName)) sq.classList.add('hint-move');

      const target = legalTargets.find(t => t.to === sqName);
      if (target) {
        const dot = document.createElement('div');
        dot.className = target.capture ? 'move-capture' : 'move-dot';
        sq.appendChild(dot);
      }

      if (dr === 7) { const f = document.createElement('span'); f.className='coord-file'; f.textContent=file; sq.appendChild(f); }
      if (dc === 0) { const rk = document.createElement('span'); rk.className='coord-rank'; rk.textContent=rank; sq.appendChild(rk); }

      const p = grid[r][c];
      if (p) { const span = document.createElement('span'); span.textContent = PIECES[p.color + p.type]; sq.appendChild(span); }

      sq.onclick = () => onSquareClick(sqName);
      boardEl.appendChild(sq);
    }
  }
  updateStatus();
}

function updateStatus() {
  const el = document.getElementById('status');
  if (game.game_over()) {
    if (game.in_checkmate()) el.textContent = '♛ Мат! Победили ' + (game.turn()==='w'?'чёрные':'белые');
    else el.textContent = '½ Ничья';
  } else {
    el.textContent = 'Ход ' + (game.turn()==='w'?'белых':'чёрных');
  }
}

function onSquareClick(sq) {
  if (game.game_over()) return;

  // Попытка сделать ход
  if (selectedSquare) {
    const move = game.move({ from: selectedSquare, to: sq, promotion: 'q' });
    if (move) {
      selectedSquare = null; legalTargets = []; bestMoveHint = null;
      lastMoveSquares = [move.from, move.to];
      document.getElementById('quality').style.display = 'none'; // Скрываем старую оценку
      renderBoard();
      
      // Запускаем анализ новой позиции
      analyzePosition();
      return;
    }
  }

  // Выбор фигуры (теперь можно выбирать ЛЮБУЮ фигуру, чей сейчас ход)
  const p = game.get(sq);
  if (p && p.color === game.turn()) {
    selectedSquare = sq;
    legalTargets = game.moves({ square: sq, verbose: true }).map(m => ({ to: m.to, capture: !!m.captured }));
  } else {
    selectedSquare = null; legalTargets = [];
  }
  renderBoard();
}

// ==========================================
// 5. КНОПКИ
// ==========================================
function resetGame() {
  game = new Chess();
  selectedSquare = null; lastMoveSquares = []; bestMoveHint = null; legalTargets = [];
  prevScoreWhite = null; prevTurn = null;
  document.getElementById('quality').style.display = 'none';
  if (stockfish && engineReady) stockfish.postMessage('ucinewgame');
  renderBoard();
  analyzePosition(); // Анализ первого хода
}

function flipBoard() { boardFlipped = !boardFlipped; renderBoard(); }

function undoMove() {
  if (game.history().length === 0) return;
  game.undo();
  
  selectedSquare = null; lastMoveSquares = []; bestMoveHint = null; legalTargets = [];
  prevScoreWhite = null; prevTurn = null;
  document.getElementById('quality').style.display = 'none';
  renderBoard();
  analyzePosition(); // Пересчитываем подсказку для отмененной позиции
}

// Мгновенный старт
renderBoard();
initStockfish();
</script>
</body>
</html>
