<script type="module">
  import { Chessboard, FEN, ARROW_TYPE } from 'https://cdn.jsdelivr.net/npm/cm-chessboard@8/src/Chessboard.js';

  window.ARROW_TYPE = ARROW_TYPE;
  window.dispatchEvent(new Event('cmReady'));
</script>

<style>
  :root {
    --board-size: min(92vw, 520px);
    --primary: #7fa650;
    --primary-hover: #6d9144;
    --bg-dark: #1e1e24;

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 50% 0%, #2a2a35 0%, #151518 100%);
    color: var(--text-main);

  .main-container {
    display: flex;

  }

  /* Панель управления */
  .control-panel {
    background: var(--panel-bg);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    border: 1px solid var(--border-color);
  }

  .panel-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
  }

  .panel-label {
    font-size: 13px;
    color: var(--text-muted);
    width: 100%;

  }

  /* Слайдер Elo */
  .elo-slider-wrap {
    display: flex;
    flex-direction: column;
    width: 100%;
    gap: 6px;
  }
  .elo-slider-wrap input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 8px;
    border-radius: 4px;
    background: linear-gradient(to right, #4a4a55 0%, var(--primary) 50%, #f44336 100%);
    outline: none;
  }
  .elo-slider-wrap input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #fff;

    box-shadow: 0 0 8px rgba(0,0,0,0.3);
  }
  .elo-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
  }
  #elo-value {
    font-weight: bold;
    color: var(--accent);
    font-size: 16px;
    text-align: center;
  }

  /* Кнопки */
  button {
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: #3a3a45;
    color: #eee;
    cursor: pointer;
    transition: all 0.2s;
    flex: 1;
    min-width: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  button:hover { background: #4a4a55; }
  button:active { transform: scale(0.96); }
  button.primary { background: var(--primary); color: #fff; }
  button.primary:hover { background: var(--primary-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Статус и вердикт */
  .status-bar {
    text-align: center;
    font-size: 15px;
    padding: 10px;
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    border: 1px solid var(--border-color);
  }
  #verdict {
    font-weight: 700;
    padding: 10px;
    border-radius: 8px;
    display: none;
    text-align: center;
    animation: pop 0.3s ease-out;
    margin-top: 8px;
  }
  @keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .v-excellent { background: #1b5e20; color: #a5f5b5; }
  .v-good      { background: #33691e; color: #dcedc8; }
  .v-neutral   { background: #37474f; color: #cfd8dc; }
  .v-inaccuracy{ background: #e65100; color: #fff3e0; }
  .v-mistake   { background: #c62828; color: #ffcdd2; }
  .v-blunder   { background: #7f0000; color: #ffcdd2; border: 1px solid #f44336; }

  /* Контейнер доски */
  .board-container {
    position: relative;
    width: 100%;
    max-width: var(--board-size);
    aspect-ratio: 1 / 1;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 12px 36px rgba(0,0,0,0.6);
  }
  #board {
    width: 100%;
    height: 100%;
  }

  /* Скрытие встроенных подсказок cm-chessboard, оставляем только стрелки */
  .cm-chessboard .marker-layer .square { display: none; }
</style>

<body>

<h1>♟ Шахматный Анализатор Pro</h1>

<div class="main-container">
  <!-- Панель управления -->
  <div class="control-panel">
    <div class="panel-label">Уровень сложности (Elo)</div>
    <div class="elo-slider-wrap">
      <input type="range" id="elo-slider" min="800" max="2500" step="100" value="1500">
      <div class="elo-labels">
        <span>800</span><span>1500</span><span>2500</span>
      </div>
      <div id="elo-value">1500 Elo</div>
    </div>

    <div class="panel-row">
      <button id="btn-new" class="primary">🔄 Новая игра</button>
      <button id="btn-undo">↶ Ход назад</button>
      <button id="btn-flip">🔃 Перевернуть</button>
    </div>
    <div class="panel-row">
      <button id="btn-hint" class="primary">💡 Подсказка</button>
      <button id="btn-clear-arrow">❌ Убрать стрелку</button>
    </div>
  </div>

  <!-- Статус и вердикт -->
  <div class="status-bar" id="status">Ход белых</div>
  <div id="verdict"></div>

  <!-- Доска -->
  <div class="board-container">
    <div id="board"></div>
  </div>

  <div style="font-size: 12px; color: #888; text-align: center;" id="engine-status">Инициализация движка...</div>
</div>

<!-- Основной скрипт логики -->
<script>
// ============================================================
// 1. КОНСТАНТЫ И ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
// ============================================================
const PIECE_VALUES = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

let game = new Chess();
let board = null;
let currentElo = 1500;
let isAnalyzing = false;

// Переменные для оценки хода
let prevScoreWhite = null; // Оценка позиции (в сантипешках) с точки зрения белых
let prevTurn = null;       // Чей был ход перед текущим анализом

// Stockfish
let stockfish = null;
let engineReady = false;
let engineFailed = false;
let currentSearchResolve = null;
let searchTimerId = null;
let multiPVLines = {};
let lastPrimaryScore = null;

// ============================================================
// 2. ИНИЦИАЛИЗАЦИЯ ДВИЖКА
// ============================================================
async function initStockfish() {
  const st = document.getElementById('engine-status');
  try {
    // Используем стабильный CDN cdnjs
    const url = 'https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.1/stockfish.js';
    const response = await fetch(url);
    if (!response.ok) throw new Error('Fetch failed');

    const scriptText = await response.text();
    const blob = new Blob([scriptText], { type: 'application/javascript' });
    const workerUrl = URL.createObjectURL(blob);

    stockfish = new Worker(workerUrl);

    stockfish.onerror = (e) => {
      console.error('Worker error:', e);
      failEngine('Ошибка внутри движка. Включен резервный режим.');
    };

    stockfish.onmessage = (ev) => handleEngineMessage(ev.data);

    stockfish.postMessage('uci');
    stockfish.postMessage('isready');

    // Таймаут: если за 3 секунды движок не ответил — считаем, что не загрузился
    setTimeout(() => {
      if (!engineReady && !engineFailed) {
        failEngine('Движок не отвечает. Резервный режим.');
      }
    }, 3000);

  } catch (e) {
    console.warn('Stockfish failed to load:', e);
    failEngine('Нет доступа к CDN движка. Резервный режим.');
  }
}

function failEngine(msg) {
  if (engineReady || engineFailed) return;
  engineFailed = true;
  document.getElementById('engine-status').textContent = '⚠ ' + msg;
}

function handleEngineMessage(line) {
  if (typeof line !== 'string') return;

  if (line === 'uciok') {
    // Настраиваем движок
    stockfish.postMessage('setoption name MultiPV value 3'); // Для выбора 2-3 хода
    stockfish.postMessage('isready');
    return;
  }
  if (line === 'readyok') {
    if (!engineReady) {
      engineReady = true;
      document.getElementById('engine-status').textContent = '✅ Stockfish готов';
      updateEngineStrength(); // Применяем текущий Elo
      analyzePosition(); // Анализируем стартовую позицию
    }
    return;
  }
  if (line.startsWith('info') && line.includes('multipv')) {
    const mp = line.match(/multipv\s+(\d+)/);
    const sc = line.match(/score\s+(cp|mate)\s+(-?\d+)/);
    const pv = line.match(/pv\s+([a-h][1-8][a-h][1-8][qrbn]?)/);
    if (mp && pv) {
      let score = 0;
      if (sc) {
        score = parseInt(sc[2], 10);
        if (sc[1] === 'mate') score = score > 0 ? 100000 : -100000;
      }
      multiPVLines[parseInt(mp[1], 10)] = { move: pv[1], score };
    }
    return;
  }
  if (line.startsWith('bestmove')) {
    if (searchTimerId) { clearTimeout(searchTimerId); searchTimerId = null; }
    const bestMove = line.split(/\s+/)[1];
    const candidates = Object.values(multiPVLines).sort((a, b) => b.score - a.score).map(x => x.move);

    if (candidates.length === 0 && bestMove && bestMove !== '(none)') candidates.push(bestMove);
    lastPrimaryScore = multiPVLines[1] ? multiPVLines[1].score : null;

    if (currentSearchResolve) {
      currentSearchResolve({ moves: candidates, score: lastPrimaryScore });
      currentSearchResolve = null;
    }
    multiPVLines = {};
  }
}

function updateEngineStrength() {
  if (!engineReady || engineFailed || !stockfish) return;

  // Ограничиваем силу через UCI_Elo (доступно с 1320) и Skill Level
  // UCI_LimitStrength = true заставляет движок играть слабее
  stockfish.postMessage('setoption name UCI_LimitStrength value true');
  stockfish.postMessage(`setoption name UCI_Elo value ${currentElo}`);
  // Skill Level также влияет: 0-20 (20 макс)
  const skill = Math.max(0, Math.min(20, Math.floor((currentElo - 800) / 85)));
  stockfish.postMessage(`setoption name Skill Level value ${skill}`);
}

function getEngineMoves(fen, movetime = 150) {
  return new Promise((resolve) => {
    if (!engineReady || engineFailed || !stockfish) {
      return resolve(getFallbackMove(game)); // Резерв
    }
    if (currentSearchResolve) { stockfish.postMessage('stop'); currentSearchResolve = null; }

    multiPVLines = {};
    lastPrimaryScore = null;
    currentSearchResolve = (result) => {
      if (searchTimerId) clearTimeout(searchTimerId);
      resolve(result);
    };

    stockfish.postMessage('position fen ' + fen);
    stockfish.postMessage('go movetime ' + movetime);
    searchTimerId = setTimeout(() => stockfish.postMessage('stop'), movetime + 1000);
  });
}

// ============================================================
// 3. РЕЗЕРВНЫЙ АЛГОРИТМ (Если движок не загрузился)
// ============================================================
const PAWN_PST = [
   0,  0,  0,  0,  0,  0,  0,  0,
  50, 50, 50, 50, 50, 50, 50, 50,
  10, 10, 20, 30, 30, 20, 10, 10,
   5,  5, 10, 25, 25, 10,  5,  5,
   0,  0,  0, 20, 20,  0,  0,  0,
   5, -5,-10,  0,  0,-10, -5,  5,
   5, 10, 10,-20,-20, 10, 10,  5,
   0,  0,  0,  0,  0,  0,  0,  0
];

function evaluatePosition(g) {
  if (g.in_checkmate()) return g.turn() === 'w' ? -99999 : 99999;
  if (g.in_draw()) return 0;

  let score = 0;
  const grid = g.board();
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = grid[r][c];
      if (!p) continue;
      let val = PIECE_VALUES[p.type];
      if (p.type === 'p') {
        const index = p.color === 'w' ? (r * 8 + c) : ((7 - r) * 8 + c);
        val += PAWN_PST[index];
      }
      score += p.color === 'w' ? val : -val;
    }
  }
  return g.turn() === 'w' ? score : -score;
}

function minimax(g, depth, alpha, beta, isMax) {
  if (depth === 0 || g.game_over()) return evaluatePosition(g);
  const moves = g.moves({ verbose: true });
  if (isMax) {
    let best = -Infinity;
    for (const m of moves) {
      g.move(m);
      best = Math.max(best, minimax(g, depth - 1, alpha, beta, false));
      g.undo();
      alpha = Math.max(alpha, best);
      if (beta <= alpha) break;
    }
    return best;
  } else {
    let best = Infinity;
    for (const m of moves) {
      g.move(m);
      best = Math.min(best, minimax(g, depth - 1, alpha, beta, true));
      g.undo();
      beta = Math.min(beta, best);
      if (beta <= alpha) break;
    }
    return best;
  }
}

function getFallbackMove(g) {
  const moves = g.moves({ verbose: true });
  if (!moves.length) return { moves: [], score: 0 };

  let bestMove = null;
  let bestScore = -Infinity;
  const turn = g.turn();

  const tempGame = new Chess(g.fen()); // Клонируем доску

  for (const m of moves) {
    tempGame.move(m);
    const score = -evaluatePosition(tempGame);
    tempGame.undo();

    if (score > bestScore) {
      bestScore = score;
      bestMove = m;
    }
  }

  const scoreWhite = turn === 'w' ? bestScore : -bestScore;
  return { moves: [bestMove.from + bestMove.to + (bestMove.promotion || '')], score: scoreWhite };
}

// ============================================================
// 4. АНАЛИЗ И ОЦЕНКА
// ============================================================
async function analyzePosition() {
  if (game.game_over()) {
    clearArrow();
    renderBoard();
    document.getElementById('status').textContent = 'Игра окончена';
    return;
  }

  const currentTurn = game.turn();
  const fen = game.fen();

  document.getElementById('status').textContent = '🤔 Анализ...';
  document.getElementById('btn-hint').disabled = true;

  // Запрашиваем у движка (или резерва) оценку и лучший ход
  const res = await getEngineMoves(fen, 150);

  // Обновляем стрелку (показываем лучший ход)
  if (res.moves.length > 0) {
    // Рисуем стрелку от лучшего хода
    drawArrow(res.moves[0].slice(0, 2), res.moves[0].slice(2, 4));
  } else {
    clearArrow();
  }

  // Оценка предыдущего хода
  if (prevScoreWhite !== null && prevTurn !== null && res.score !== null) {
    const currentScoreWhite = res.score;
    let loss = prevTurn === 'w' ? (prevScoreWhite - currentScoreWhite) : (currentScoreWhite - prevScoreWhite);
    showVerdict(loss);
  } else {
    document.getElementById('verdict').style.display = 'none';
  }

  // Запоминаем оценку для следующего хода
  prevScoreWhite = res.score;
  prevTurn = currentTurn;

  document.getElementById('status').textContent = 'Ход ' + (currentTurn === 'w' ? 'белых' : 'чёрных');
  document.getElementById('btn-hint').disabled = false;
  renderBoard();
}

function showVerdict(loss) {
  const el = document.getElementById('verdict');
  let text, cls;

  if (loss <= -30)      { text = '🌟 Отличный ход!';      cls = 'v-excellent'; }
  else if (loss <= 20)  { text = '👍 Хороший ход';        cls = 'v-good'; }
  else if (loss <= 60)  { text = '😐 Нормально';          cls = 'v-neutral'; }
  else if (loss <= 150) { text = '⚠️ Неточность';         cls = 'v-inaccuracy'; }
  else if (loss <= 300) { text = '❌ Ошибка';             cls = 'v-mistake'; }
  else                  { text = '💩 Полная хуйня';       cls = 'v-blunder'; }

  el.textContent = text;
  el.className = cls;
  el.style.display = 'block';
}

// ============================================================
// 5. РАБОТА С ДОСКОЙ (cm-chessboard)
// ============================================================
function initBoard() {
  board = new window.Chessboard(document.getElementById('board'), {
    position: window.FEN.start,
    assetsUrl: 'https://cdn.jsdelivr.net/npm/cm-chessboard@8/assets/',
    style: {
      cssClass: 'default',
      showCoordinates: true,
      aspectRatio: 1,
    },
    extensions: [
      { class: 'Arrows', props: { persist: true } }
    ]
  });

  // Подписываемся на события перемещения фигур
  board.enableMoveInput((event) => {
    if (event.type === 'move-input') {
      const move = game.move({
        from: event.from,
        to: event.to,
        promotion: 'q'
      });
      if (move) {
        // Ход удался
        clearArrow();
        document.getElementById('verdict').style.display = 'none';
        board.setPosition(game.fen());
        analyzePosition(); // Запускаем анализ следующей позиции
        return true;
      }
      return false;
    }
    return true;
  });
}

// Отрисовка стрелки (оверлей)
function drawArrow(from, to) {
  if (!board) return;
  clearArrow();
  // ARROW_TYPE.default — стандартная стрелка (можно выбрать и другой цвет)
  board.addArrow(window.ARROW_TYPE.default, from, to);
}

function clearArrow() {
  if (!board) return;
  // Удаляем все стрелки
  const arrows = board.getArrows();
  if (arrows && arrows.length) {
    arrows.forEach(a => board.removeArrow(a.type, a.from, a.to));
  }
}

// ============================================================
// 6. ИМИТАЦИЯ ЧЕЛОВЕКА
// ============================================================
function getHumanDelay() {
  // Случайная задержка от 3000 до 10000 мс (3-10 секунд)
  return Math.floor(Math.random() * 7000) + 3000;
}

function pickHumanMove(candidates, elo) {
  if (!candidates || candidates.length === 0) return null;
  if (candidates.length === 1) return candidates[0];

  // Вероятность ошибки зависит от Elo
  // На низких уровнях часто выбираем не первый ход
  let errorProbability;
  if (elo <= 1000) errorProbability = 0.6;
  else if (elo <= 1300) errorProbability = 0.45;
  else if (elo <= 1600) errorProbability = 0.3;
  else if (elo <= 2000) errorProbability = 0.15;
  else errorProbability = 0.05;

  if (Math.random() < errorProbability) {
    // Выбираем случайный из 2-го или 3-го
    const idx = Math.min(1 + Math.floor(Math.random() * 2), candidates.length - 1);
    return candidates[idx];
  }
  return candidates[0];
}

// Кнопка "Подсказка" с задержкой
async function handleHint() {
  if (isAnalyzing || game.game_over()) return;
  isAnalyzing = true;
  document.getElementById('btn-hint').disabled = true;
  document.getElementById('status').textContent = '🤔 Бот думает...';

  // Имитация задержки
  const delay = getHumanDelay();
  const startTime = Date.now();

  // Запрашиваем у движка лучшие ходы
  const res = await getEngineMoves(game.fen(), 200);
  let bestMove = null;
  if (res.moves.length > 0) {
    bestMove = pickHumanMove(res.moves, currentElo);
  }

  const elapsed = Date.now() - startTime;
  const remainingDelay = Math.max(0, delay - elapsed);
  if (remainingDelay > 0) {
    await new Promise(r => setTimeout(r, remainingDelay));
  }

  // Рисуем стрелку выбранного хода
  if (bestMove) {
    drawArrow(bestMove.slice(0, 2), bestMove.slice(2, 4));
  } else {
    clearArrow();
  }

  document.getElementById('status').textContent = 'Ход ' + (game.turn() === 'w' ? 'белых' : 'чёрных');
  document.getElementById('btn-hint').disabled = false;
  isAnalyzing = false;
}

// ============================================================
// 7. УПРАВЛЕНИЕ
// ============================================================
function renderBoard() {
  if (!board) return;
  board.setPosition(game.fen());
}

function resetGame() {
  game = new Chess();
  clearArrow();
  document.getElementById('verdict').style.display = 'none';
  prevScoreWhite = null;
  prevTurn = null;
  document.getElementById('status').textContent = 'Ход белых';
  if (stockfish && engineReady) stockfish.postMessage('ucinewgame');
  renderBoard();
  analyzePosition();
}

function undoMove() {
  if (game.history().length === 0) return;
  game.undo();
  clearArrow();
  document.getElementById('verdict').style.display = 'none';
  prevScoreWhite = null;
  prevTurn = null;
  renderBoard();
  analyzePosition();
}

function flipBoard() {
  if (board) board.setOrientation(board.getOrientation() === 'w' ? 'b' : 'w');
}

// ============================================================
// 8. ИНИЦИАЛИЗАЦИЯ
// ============================================================
// Ждем загрузки модулей cm-chessboard
window.addEventListener('cmReady', () => {
  initBoard();
  renderBoard();
  initStockfish();
  analyzePosition(); // Анализ стартовой позиции
});

// Настройка слайдера Elo
const eloSlider = document.getElementById('elo-slider');
const eloValue = document.getElementById('elo-value');

eloSlider.addEventListener('input', (e) => {
  currentElo = parseInt(e.target.value, 10);
  eloValue.textContent = currentElo + ' Elo';
  updateEngineStrength();
});

// Привязка кнопок
document.getElementById('btn-new').addEventListener('click', resetGame);
document.getElementById('btn-undo').addEventListener('click', undoMove);
document.getElementById('btn-flip').addEventListener('click', flipBoard);
document.getElementById('btn-hint').addEventListener('click', handleHint);
document.getElementById('btn-clear-arrow').addEventListener('click', () => {
  clearArrow();
});

// Устанавливаем начальное значение Elo
currentElo = parseInt(eloSlider.value, 10);
eloValue.textContent = currentElo + ' Elo';
</script>

</body>
</html>
